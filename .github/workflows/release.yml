name: Stable Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist
      - uses: softprops/action-gh-release@v2
        with:
          name: Kyu ${{ github.ref_name }} — стабильная версия
          prerelease: false
          files: |
            dist/Kyu-Setup-*.exe
            dist/Kyu-Setup-*.exe.blockmap
            dist/Kyu-*-win.zip
            dist/Kyu-*-portable.exe
